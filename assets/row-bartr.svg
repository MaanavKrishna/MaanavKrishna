<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="124" viewBox="0 0 1600 124" role="img" aria-label="bartr: Shopify for campus barter: sell, swap or give away."><style>@font-face{font-family:'MK Body';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.fb{font-family:'MK Body','Helvetica Neue', Arial, sans-serif}@font-face{font-family:'MK Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fm{font-family:'MK Mono',ui-monospace, Menlo, Consolas, monospace}@font-face{font-family:'MK Mono Bold';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}.fmb{font-family:'MK Mono Bold',ui-monospace, Menlo, Consolas, monospace}@font-face{font-family:'MK Display';src:url(data:font/woff2;base64,) format('woff2');font-weight:800;font-style:normal}.fx{font-family:'MK Display','Helvetica Neue', Arial, sans-serif}
.plot{stroke-dasharray:1;stroke-dashoffset:1;animation:plot 2.2s cubic-bezier(.65,0,.25,1) forwards}
@keyframes plot{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center}
.sw{animation:spin 6s linear infinite}.nudge{animation:nudge 2.6s ease-in-out infinite}@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translate(2.5px,-2.5px)}}</style><rect x=".75" y=".75" width="1598.5" height="122.5" rx="22" fill="#F2EFE7" stroke="#D2CDC1" stroke-width="1.5"/><text x="44.0" y="72.0" class="fmb" font-size="14" fill="#1F3BFF" letter-spacing="1" >11</text><text x="104.0" y="78.0" class="fx" font-size="40" fill="#0C0C0C" letter-spacing="-1.5" >bartr</text><text x="470.0" y="76.0" class="fb" font-size="21" fill="#86827A" >Shopify for campus barter: sell, swap or give away.</text><text x="1110.0" y="74.0" class="fm" font-size="12" fill="#86827A" letter-spacing="1.2" >NEXT.JS 15 / REACT 19</text><g transform="translate(1418,62)"><g class="spin sw"><path d="M-22,-8 A24,24 0 0 1 22,-8" fill="none" stroke="#0C0C0C" stroke-width="5"/><path d="M14,-18 L23,-6 L9,-3" fill="none" stroke="#0C0C0C" stroke-width="5"/><path d="M22,8 A24,24 0 0 1 -22,8" fill="none" stroke="#1F3BFF" stroke-width="5"/><path d="M-14,18 L-23,6 L-9,3" fill="none" stroke="#1F3BFF" stroke-width="5"/></g></g><g transform="translate(1538,62)"><circle r="24" fill="none" stroke="#0C0C0C" stroke-width="1.5" stroke-opacity=".35"/><path class="nudge" d="M-6,6 L6,-6 M-4,-6 H6 V4" fill="none" stroke="#0C0C0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>