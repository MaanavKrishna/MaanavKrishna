<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-label="PyWeb: Full-stack web apps in one Python file.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10162e"/><stop offset="1" stop-color="#070b18"/></linearGradient>
<radialGradient id="glow" cx="88%" cy="0%" r="75%"><stop offset="0" stop-color="#facc15" stop-opacity=".30"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#3b82f6" stop-opacity=".18"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#facc15" stop-opacity=".9"/><stop offset=".5" stop-color="#3b82f6" stop-opacity=".25"/><stop offset="1" stop-color="#facc15" stop-opacity=".5"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b18" stop-opacity="0"/><stop offset="1" stop-color="#070b18" stop-opacity=".85"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".07"/></pattern>
<clipPath id="clip"><rect width="840" height="520" rx="28"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
</style>
<g clip-path="url(#clip)">
<rect width="840" height="520" fill="url(#bg)"/>
<rect width="840" height="520" fill="url(#dots)"/>
<rect width="840" height="520" fill="url(#glow)"/>
<rect width="840" height="520" fill="url(#glow2)"/>
<g>
<rect x="60" y="36" width="300" height="236" rx="16" fill="#0b1224" stroke="#26314f"/>
<circle cx="84" cy="58" r="5" fill="#fb7185"/><circle cx="102" cy="58" r="5" fill="#fbbf24"/><circle cx="120" cy="58" r="5" fill="#34d399"/>
<text x="340" y="63" text-anchor="end" class="mono" font-size="13" fill="#5b6585">app.pyweb</text>
<rect x="84" y="88" width="120" height="9" rx="4.5" fill="#facc15" fill-opacity=".75"/><rect x="84" y="110" width="190" height="9" rx="4.5" fill="#60a5fa" fill-opacity=".75"/><rect x="102" y="132" width="150" height="9" rx="4.5" fill="#94a3b8" fill-opacity=".75"/><rect x="84" y="154" width="90" height="9" rx="4.5" fill="#facc15" fill-opacity=".75"/><rect x="102" y="176" width="210" height="9" rx="4.5" fill="#60a5fa" fill-opacity=".75"/><rect x="102" y="198" width="170" height="9" rx="4.5" fill="#94a3b8" fill-opacity=".75"/><rect x="84" y="220" width="130" height="9" rx="4.5" fill="#a78bfa" fill-opacity=".75"/>
<path id="p1" d="M360,150 C440,150 440,95 520,95" fill="none" stroke="#facc15" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 6"/>
<path id="p2" d="M360,160 C440,160 440,210 520,210" fill="none" stroke="#60a5fa" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 6"/>
<circle r="6" fill="#facc15"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
<circle r="6" fill="#60a5fa"><animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
<rect x="403" y="141" width="78" height="28" rx="14" fill="#10162e" stroke="url(#acc)"/>
<text x="442" y="160" text-anchor="middle" class="mono" font-size="13" fill="#f8fafc">compile</text>
<g><rect x="520" y="48" width="270" height="94" rx="14" fill="#facc15" fill-opacity=".08" stroke="#facc15" stroke-opacity=".6"/>
<text x="540" y="78" class="mono" font-size="13" letter-spacing="2" fill="#facc15">BROWSER</text>
<text x="540" y="106" class="mono" font-size="16" fill="#f8fafc">submit() → 312 B of JS</text>
<text x="540" y="128" class="mono" font-size="13" fill="#a5adcb">reactive · no toolchain</text></g>
<g><rect x="520" y="163" width="270" height="94" rx="14" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-opacity=".6"/>
<text x="540" y="193" class="mono" font-size="13" letter-spacing="2" fill="#60a5fa">SERVER</text>
<text x="540" y="221" class="mono" font-size="16" fill="#f8fafc">@server sign() → RPC</text>
<text x="540" y="243" class="mono" font-size="13" fill="#a5adcb">typed · validated · SSR</text></g>
</g>
<rect y="260" width="840" height="260" fill="url(#fadeDown)"/>
<line x1="44" y1="312" x2="796" y2="312" stroke="url(#acc)" stroke-opacity=".35"/>
</g>
<rect x="1" y="1" width="838" height="518" rx="27" fill="none" stroke="url(#edge)" stroke-width="2"/>

<text x="44" y="350" class="mono" font-size="16" letter-spacing="3" fill="#facc15">WEB FRAMEWORK · ON PYPI</text>
<text x="44" y="400" class="sans" font-size="46" font-weight="800" fill="#f8fafc">PyWeb</text>
<text x="44" y="438" class="sans" font-size="21" fill="#a5adcb">Full-stack web apps in one Python file.</text>
<g transform="translate(44,462)"><rect width="81" height="32" rx="16" fill="#facc15" fill-opacity=".12" stroke="#facc15" stroke-opacity=".45"/><text x="40" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#facc15">Python</text></g><g transform="translate(135,462)"><rect width="99" height="32" rx="16" fill="#facc15" fill-opacity=".12" stroke="#facc15" stroke-opacity=".45"/><text x="50" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#facc15">Compiler</text></g><g transform="translate(244,462)"><rect width="53" height="32" rx="16" fill="#facc15" fill-opacity=".12" stroke="#facc15" stroke-opacity=".45"/><text x="27" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#facc15">SSR</text></g><g transform="translate(308,462)"><rect width="108" height="32" rx="16" fill="#facc15" fill-opacity=".12" stroke="#facc15" stroke-opacity=".45"/><text x="54" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#facc15">Typed RPC</text></g>
</svg>