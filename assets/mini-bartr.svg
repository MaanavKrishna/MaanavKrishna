<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="bartr: Shopify for campus barter: sell, swap or give away inside your own campus.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10162e"/><stop offset="1" stop-color="#070b18"/></linearGradient>
<radialGradient id="glow" cx="15%" cy="50%" r="55%"><stop offset="0" stop-color="#34d399" stop-opacity=".28"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".8"/><stop offset="1" stop-color="#fbbf24" stop-opacity=".2"/></linearGradient>
<clipPath id="clip"><rect width="840" height="300" rx="24"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
.sw{animation:spin 6s linear infinite}</style>
<g clip-path="url(#clip)"><rect width="840" height="300" fill="url(#bg)"/><rect width="840" height="300" fill="url(#glow)"/>
<g><g class="sw" style="transform-origin:150px 150px">
<path d="M90,120 A70,70 0 0 1 210,120" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round"/><path d="M210,120 l-4,-22 M210,120 l-22,-2" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
<path d="M210,180 A70,70 0 0 1 90,180" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/><path d="M90,180 l4,22 M90,180 l22,2" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/></g>
<text x="150" y="158" text-anchor="middle" class="mono" font-size="16" fill="#f8fafc">swap</text></g></g>
<rect x="1" y="1" width="838" height="298" rx="23" fill="none" stroke="url(#edge)" stroke-width="2"/>
<text x="290" y="110" class="sans" font-size="40" font-weight="800" fill="#f8fafc">bartr</text>
<text x="290" y="150" class="sans" font-size="19" fill="#a5adcb">Shopify for campus barter: sell, swap or</text>
<text x="290" y="178" class="sans" font-size="19" fill="#a5adcb">give away inside your own campus.</text>
<g transform="translate(290,214)"><rect width="111" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".45"/><text x="56" y="20" text-anchor="middle" class="mono" font-size="14" fill="#34d399">Next.js 15</text></g><g transform="translate(409,214)"><rect width="94" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".45"/><text x="47" y="20" text-anchor="middle" class="mono" font-size="14" fill="#34d399">React 19</text></g><g transform="translate(512,214)"><rect width="103" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".45"/><text x="51" y="20" text-anchor="middle" class="mono" font-size="14" fill="#34d399">shadcn/ui</text></g>
</svg>