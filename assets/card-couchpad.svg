y=".5"/><circle cx="100" cy="159" r="6" fill="#f472b6" class="stick" style="animation-delay:-0.4s"/><circle cx="146" cy="150" r="7" fill="#a78bfa"/><circle cx="162" cy="166" r="7" fill="#22d3ee"/><rect x="70" y="208" width="110" height="62" rx="12" fill="#0b1224" stroke="#f472b6" stroke-opacity=".7" stroke-width="2"/><circle cx="100" cy="239" r="15" fill="none" stroke="#f472b6" stroke-opacity=".5"/><circle cx="100" cy="239" r="6" fill="#f472b6" class="stick" style="animation-delay:-0.8s"/><circle cx="146" cy="230" r="7" fill="#a78bfa"/><circle cx="162" cy="246" r="7" fill="#22d3ee"/>
