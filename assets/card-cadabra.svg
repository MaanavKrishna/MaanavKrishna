<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-label="Cadabra: The room invents a game. AI builds it in seconds.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10162e"/><stop offset="1" stop-color="#070b18"/></linearGradient>
<radialGradient id="glow" cx="88%" cy="0%" r="75%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#f472b6" stop-opacity=".18"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".9"/><stop offset=".5" stop-color="#f472b6" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".5"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b18" stop-opacity="0"/><stop offset="1" stop-color="#070b18" stop-opacity=".85"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".07"/></pattern>
<clipPath id="clip"><rect width="840" height="520" rx="28"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
.ball{animation:bounce .9s cubic-bezier(.5,0,.5,1) infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-95px)}}
.crate{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
.idea{animation:rise 3.9s ease-in infinite}
@keyframes rise{0%{opacity:0;transform:translateY(20px)}15%,60%{opacity:1}100%{opacity:0;transform:translateY(-110px)}}
.stick{animation:wig 1.4s ease-in-out infinite alternate}
@keyframes wig{from{transform:translate(-5px,3px)}to{transform:translate(5px,-4px)}}</style>
<g clip-path="url(#clip)">
<rect width="840" height="520" fill="url(#bg)"/>
<rect width="840" height="520" fill="url(#dots)"/>
<rect width="840" height="520" fill="url(#glow)"/>
<rect width="840" height="520" fill="url(#glow2)"/>
<g>
<rect x="255" y="34" width="330" height="196" rx="16" fill="#0b1224" stroke="url(#acc)" stroke-width="2.5"/>
<rect x="400" y="230" width="40" height="18" fill="#1e2747"/><rect x="370" y="248" width="100" height="6" rx="3" fill="#1e2747"/>
<line x1="285" y1="196" x2="555" y2="196" stroke="#22d3ee" stroke-opacity=".5" stroke-width="2"/>
<rect class="crate" x="530" y="164" width="26" height="26" rx="4" fill="none" stroke="#a78bfa" stroke-width="3"/>
<circle class="ball" cx="330" cy="180" r="16" fill="#22d3ee" style="animation-delay:0s"/><circle class="ball" cx="420" cy="183" r="13" fill="#f472b6" style="animation-delay:-0.35s"/><circle class="ball" cx="500" cy="178" r="18" fill="#facc15" style="animation-delay:-0.7s"/>
<text x="285" y="64" class="mono" font-size="13" letter-spacing="2" fill="#22d3ee">RING OUT · LIVE</text>
<text x="555" y="64" text-anchor="end" class="mono" font-size="13" fill="#a5adcb">gravity ×0.4</text>
<g class="idea" style="animation-delay:0s"><rect x="60" y="150" width="128" height="30" rx="15" fill="#10162e" stroke="#22d3ee" stroke-opacity=".7"/><text x="124" y="170" text-anchor="middle" class="mono" font-size="14" fill="#f8fafc">laser sharks</text></g><g class="idea" style="animation-delay:-1.3s"><rect x="640" y="150" width="128" height="30" rx="15" fill="#10162e" stroke="#22d3ee" stroke-opacity=".7"/><text x="704" y="170" text-anchor="middle" class="mono" font-size="14" fill="#f8fafc">zero gravity</text></g><g class="idea" style="animation-delay:-2.6s"><rect x="70" y="150" width="120" height="30" rx="15" fill="#10162e" stroke="#22d3ee" stroke-opacity=".7"/><text x="130" y="170" text-anchor="middle" class="mono" font-size="14" fill="#f8fafc">disco floor</text></g><rect x="90" y="196" width="54" height="86" rx="10" fill="#0b1224" stroke="#f472b6" stroke-opacity=".7" stroke-width="2"/><circle cx="117" cy="246" r="13" fill="none" stroke="#f472b6" stroke-opacity=".6"/><circle class="stick" cx="117" cy="246" r="6" fill="#f472b6"/><rect x="700" y="196" width="54" height="86" rx="10" fill="#0b1224" stroke="#f472b6" stroke-opacity=".7" stroke-width="2"/><circle cx="727" cy="246" r="13" fill="none" stroke="#f472b6" stroke-opacity=".6"/><circle class="stick" cx="727" cy="246" r="6" fill="#f472b6"/>
</g>
<rect y="260" width="840" height="260" fill="url(#fadeDown)"/>
<line x1="44" y1="312" x2="796" y2="312" stroke="url(#acc)" stroke-opacity=".35"/>
</g>
<rect x="1" y="1" width="838" height="518" rx="27" fill="none" stroke="url(#edge)" stroke-width="2"/>

<text x="44" y="350" class="mono" font-size="16" letter-spacing="3" fill="#22d3ee">FIRE TV · GENERATIVE GAMES</text>
<text x="44" y="400" class="sans" font-size="46" font-weight="800" fill="#f8fafc">Cadabra</text>
<text x="44" y="438" class="sans" font-size="21" fill="#a5adcb">The room invents a game. AI builds it in seconds.</text>
<g transform="translate(44,462)"><rect width="118" height="32" rx="16" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="59" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#22d3ee">TypeScript</text></g><g transform="translate(172,462)"><rect width="90" height="32" rx="16" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="45" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#22d3ee">Bedrock</text></g><g transform="translate(272,462)"><rect width="81" height="32" rx="16" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="40" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#22d3ee">WebRTC</text></g><g transform="translate(362,462)"><rect width="90" height="32" rx="16" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="45" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#22d3ee">Physics</text></g>
</svg>