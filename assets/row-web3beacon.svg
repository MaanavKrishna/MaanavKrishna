<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="124" viewBox="0 0 1600 124" role="img" aria-label="Web3Beacon: A friendly Web3 guide whose wallet demo never signs."><style>@font-face{font-family:'MK Body';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.fb{font-family:'MK Body','Helvetica Neue', Arial, sans-serif}@font-face{font-family:'MK Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fm{font-family:'MK Mono',ui-monospace, Menlo, Consolas, monospace}@font-face{font-family:'MK Mono Bold';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}.fmb{font-family:'MK Mono Bold',ui-monospace, Menlo, Consolas, monospace}@font-face{font-family:'MK Display';src:url(data:font/woff2;base64,) format('woff2');font-weight:800;font-style:normal}.fx{font-family:'MK Display','Helvetica Neue', Arial, sans-serif}
.plot{stroke-dasharray:1;stroke-dashoffset:1;animation:plot 2.2s cubic-bezier(.65,0,.25,1) forwards}
@keyframes plot{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center}
