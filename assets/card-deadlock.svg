<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-label="Deadlock: Three can trade where two can't. Agents negotiate the loop.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10162e"/><stop offset="1" stop-color="#070b18"/></linearGradient>
<radialGradient id="glow" cx="88%" cy="0%" r="75%"><stop offset="0" stop-color="#34d399" stop-opacity=".30"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".9"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#34d399" stop-opacity=".5"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b18" stop-opacity="0"/><stop offset="1" stop-color="#070b18" stop-opacity=".85"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".07"/></pattern>
<clipPath id="clip"><rect width="840" height="520" rx="28"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
</style>
<g clip-path="url(#clip)">
<rect width="840" height="520" fill="url(#bg)"/>
<rect width="840" height="520" fill="url(#dots)"/>
<rect width="840" height="520" fill="url(#glow)"/>
<rect width="840" height="520" fill="url(#glow2)"/>
<g>
<line x1="80" y1="70" x2="200" y2="205" stroke="#fff" stroke-opacity=".08" stroke-dasharray="3 5"/><circle cx="80" cy="70" r="9" fill="#1e2747"/><line x1="770" y1="80" x2="640" y2="205" stroke="#fff" stroke-opacity=".08" stroke-dasharray="3 5"/><circle cx="770" cy="80" r="9" fill="#1e2747"/><line x1="110" y1="270" x2="200" y2="205" stroke="#fff" stroke-opacity=".08" stroke-dasharray="3 5"/><circle cx="110" cy="270" r="9" fill="#1e2747"/><line x1="760" y1="265" x2="640" y2="205" stroke="#fff" stroke-opacity=".08" stroke-dasharray="3 5"/><circle cx="760" cy="265" r="9" fill="#1e2747"/>
<path id="loop" d="M200,205 Q270.0,91.5 420,58 Q570.0,91.5 640,205 Q420,290 200,205" fill="none" stroke="url(#acc)" stroke-width="2.5" stroke-opacity=".75"/>
<circle r="7" fill="#fff"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle>
<circle r="5" fill="#22d3ee"><animateMotion dur="4s" begin="-1.33s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle>
<circle r="5" fill="#34d399"><animateMotion dur="4s" begin="-2.66s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle>
<circle cx="200" cy="205" r="34" fill="none" stroke="url(#gold)" stroke-width="2" style="animation:pulse 2s infinite"/><circle cx="200" cy="205" r="24" fill="#0b1224" stroke="#34d399" stroke-width="2.5"/><circle cx="200" cy="205" r="8" fill="#34d399"/><text x="200" y="257" text-anchor="middle" class="mono" font-size="14" fill="#f8fafc">Studio North</text><circle cx="420" cy="58" r="24" fill="#0b1224" stroke="#34d399" stroke-width="2.5"/><circle cx="420" cy="58" r="8" fill="#34d399"/><text x="420" y="22" text-anchor="middle" class="mono" font-size="14" fill="#f8fafc">Motionhaus</text><circle cx="640" cy="205" r="24" fill="#0b1224" stroke="#34d399" stroke-width="2.5"/><circle cx="640" cy="205" r="8" fill="#34d399"/><text x="640" y="257" text-anchor="middle" class="mono" font-size="14" fill="#f8fafc">Wordcraft</text>
<text x="286" y="118" text-anchor="middle" class="mono" font-size="12" fill="#22d3ee">video →</text>
<text x="556" y="118" text-anchor="middle" class="mono" font-size="12" fill="#22d3ee">copy →</text>
<text x="420" y="266" text-anchor="middle" class="mono" font-size="12" fill="#22d3ee">← design</text>
<text x="200" y="150" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#fbbf24">KEYSTONE</text>
</g>
<rect y="260" width="840" height="260" fill="url(#fadeDown)"/>
<line x1="44" y1="312" x2="796" y2="312" stroke="url(#acc)" stroke-opacity=".35"/>
</g>
<rect x="1" y="1" width="838" height="518" rx="27" fill="none" stroke="url(#edge)" stroke-width="2"/>

<text x="44" y="350" class="mono" font-size="16" letter-spacing="3" fill="#34d399">GRAPH AI · FALKORDB</text>
<text x="44" y="400" class="sans" font-size="46" font-weight="800" fill="#f8fafc">Deadlock</text>
<text x="44" y="438" class="sans" font-size="21" fill="#a5adcb">Three can trade where two can't. Agents negotiate the loop.</text>
<g transform="translate(44,462)"><rect width="118" height="32" rx="16" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".45"/><text x="59" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#34d399">TypeScript</text></g><g transform="translate(172,462)"><rect width="99" height="32" rx="16" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".45"/><text x="50" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#34d399">FalkorDB</text></g><g transform="translate(281,462)"><rect width="81" height="32" rx="16" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".45"/><text x="40" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#34d399">Cypher</text></g><g transform="translate(372,462)"><rect width="145" height="32" rx="16" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".45"/><text x="72" y="21.5" text-anchor="middle" class="mono" font-size="15" fill="#34d399">Claude agents</text></g>
</svg>