.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
.seis{stroke-dasharray:1500;stroke-dashoffset:1500;animation:draw 4s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1500}60%,100%{stroke-dashoffset:0}}
.res{opacity:0;animation:pop 4s ease-out infinite}
@keyframes pop{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}</style>
