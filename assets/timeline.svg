<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-label="Hackathon timeline">
<defs><linearGradient id="tl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3e635"/><stop offset=".4" stop-color="#fbbf24"/><stop offset=".7" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<radialGradient id="spark"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
</style>
<rect x="1" y="1" width="1598" height="428" rx="26" fill="#0a0f22" stroke="#26314f" stroke-width="2"/>
<rect x="60" y="212" width="1480" height="6" rx="3" fill="url(#tl)" fill-opacity=".8"/>
<circle r="18" cy="215" fill="url(#spark)"><animate attributeName="cx" values="60;1540" dur="5s" repeatCount="indefinite"/></circle>
<line x1="150" y1="215" x2="150" y2="167" stroke="#a3e635" stroke-opacity=".5" stroke-width="2"/><circle cx="150" cy="215" r="16" fill="#0b1020" stroke="#a3e635" stroke-width="4"/><circle cx="150" cy="215" r="6" fill="#a3e635"/><g class="fade" style="animation-delay:0.0s"><text x="150" y="85" text-anchor="middle" class="mono" font-size="17" fill="#a3e635">2025</text><text x="150" y="115" text-anchor="middle" class="sans" font-size="20" font-weight="700" fill="#f8fafc">Smart India Hackathon</text><text x="150" y="141" text-anchor="middle" class="mono" font-size="16" fill="#a5adcb">Traceline · Kochi Metro</text></g><line x1="410" y1="215" x2="410" y2="263" stroke="#38bdf8" stroke-opacity=".5" stroke-width="2"/><circle cx="410" cy="215" r="16" fill="#0b1020" stroke="#38bdf8" stroke-width="4"/><circle cx="410" cy="215" r="6" fill="#38bdf8"/><g class="fade" style="animation-delay:0.2s"><text x="410" y="315" text-anchor="middle" class="mono" font-size="17" fill="#38bdf8">2026</text><text x="410" y="345" text-anchor="middle" class="sans" font-size="20" font-weight="700" fill="#f8fafc">Smart India Hackathon</text><text x="410" y="371" text-anchor="middle" class="mono" font-size="16" fill="#a5adcb">AeroPulse · MoSPI</text></g><line x1="670" y1="215" x2="670" y2="167" stroke="#fbbf24" stroke-opacity=".5" stroke-width="2"/><circle cx="670" cy="215" r="30" fill="none" stroke="url(#gold)" stroke-width="3" style="animation:pulse 1.6s infinite"/><circle cx="670" cy="215" r="16" fill="#0b1020" stroke="#fbbf24" stroke-width="4"/><circle cx="670" cy="215" r="6" fill="#fbbf24"/><g class="fade" style="animation-delay:0.4s"><text x="670" y="85" text-anchor="middle" class="mono" font-size="17" fill="#fbbf24">2026  ★ WINNER</text><text x="670" y="115" text-anchor="middle" class="sans" font-size="20" font-weight="700" fill="#f8fafc">ML Empowerment 3.0</text><text x="670" y="141" text-anchor="middle" class="mono" font-size="16" fill="#a5adcb">Hum · 1st place</text></g><line x1="930" y1="215" x2="930" y2="263" stroke="#f59e0b" stroke-opacity=".5" stroke-width="2"/><circle cx="930" cy="215" r="16" fill="#0b1020" stroke="#f59e0b" stroke-width="4"/><circle cx="930" cy="215" r="6" fill="#f59e0b"/><g class="fade" style="animation-delay:0.6000000000000001s"><text x="930" y="315" text-anchor="middle" class="mono" font-size="17" fill="#f59e0b">2026</text><text x="930" y="345" text-anchor="middle" class="sans" font-size="20" font-weight="700" fill="#f8fafc">ForgeHacks</text><text x="930" y="371" text-anchor="middle" class="mono" font-size="16" fill="#a5adcb">Countersign · AI × security</text></g><line x1="1190" y1="215" x2="1190" y2="167" stroke="#34d399" stroke-opacity=".5" stroke-width="2"/><circle cx="1190" cy="215" r="16" fill="#0b1020" stroke="#34d399" stroke-width="4"/><circle cx="1190" cy="215" r="6" fill="#34d399"/><g class="fade" style="animation-delay:0.8s"><text x="1190" y="85" text-anchor="middle" class="mono" font-size="17" fill="#34d399">2026</text><text x="1190" y="115" text-anchor="middle" class="sans" font-size="20" font-weight="700" fill="#f8fafc">Graph Hacks</text><text x="1190" y="141" text-anchor="middle" class="mono" font-size="16" fill="#a5adcb">Deadlock · FalkorDB</text></g><line x1="1450" y1="215" x2="1450" y2="263" stroke="#22d3ee" stroke-opacity=".5" stroke-width="2"/><circle cx="1450" cy="215" r="16" fill="#0b1020" stroke="#22d3ee" stroke-width="4"/><circle cx="1450" cy="215" r="6" fill="#22d3ee"/><g class="fade" style="animation-delay:1.0s"><text x="1450" y="315" text-anchor="middle" class="mono" font-size="17" fill="#22d3ee">2026</text><text x="1450" y="345" text-anchor="middle" class="sans" font-size="20" font-weight="700" fill="#f8fafc">Amazon Build, Ship, Shape</text><text x="1450" y="371" text-anchor="middle" class="mono" font-size="16" fill="#a5adcb">Cadabra · Fire TV</text></g>
</svg>