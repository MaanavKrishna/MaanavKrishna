<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="230" viewBox="0 0 1600 230" role="img" aria-label="Built for India, twice. Started at Smart India Hackathon, now open source."><style>@font-face{font-family:'MK Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fm{font-family:'MK Mono',ui-monospace, Menlo, Consolas, monospace}@font-face{font-family:'MK Mono Bold';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}.fmb{font-family:'MK Mono Bold',ui-monospace, Menlo, Consolas, monospace}@font-face{font-family:'MK Serif';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:italic}.fs{font-family:'MK Serif',Georgia, serif}@font-face{font-family:'MK Display';src:url(data:font/woff2;base64,) format('woff2');font-weight:800;font-style:normal}.fx{font-family:'MK Display','Helvetica Neue', Arial, sans-serif}
.plot{stroke-dasharray:1;stroke-dashoffset:1;animation:plot 2.2s cubic-bezier(.65,0,.25,1) forwards}
@keyframes plot{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center}
</style><rect width="1600" height="230" rx="30" fill="#0C0C0C"/><text x="56.0" y="74.0" class="fmb" font-size="14" fill="#5A72FF" letter-spacing="1" >08 + 09</text><text x="140.0" y="74.0" class="fm" font-size="14" fill="#8E8A82" letter-spacing="1.5" >STARTED AT SMART INDIA HACKATHON  /  NOW OPEN SOURCE</text><text x="52.0" y="170.0" class="fx" font-size="80" fill="#F2EFE7" letter-spacing="-3.2" >Built for India,</text><text x="541.9" y="170.0" class="fs" font-size="92" fill="#5A72FF" >twice.</text><text x="1544.0" y="140.0" class="fs" font-size="27" fill="#8E8A82" text-anchor="end" >Two national problem statements,</text><text x="1544.0" y="174.0" class="fs" font-size="27" fill="#F2EFE7" text-anchor="end" >two projects you can run today.</text></svg>