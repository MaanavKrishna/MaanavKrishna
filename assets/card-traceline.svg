<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-label="Traceline: Malayalam + English PDFs → summaries linked to the source.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10162e"/><stop offset="1" stop-color="#070b18"/></linearGradient>
<radialGradient id="glow" cx="88%" cy="0%" r="75%"><stop offset="0" stop-color="#a3e635" stop-opacity=".30"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#22c55e" stop-opacity=".18"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a3e635" stop-opacity=".9"/><stop offset=".5" stop-color="#22c55e" stop-opacity=".25"/><stop offset="1" stop-color="#a3e635" stop-opacity=".5"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3e635"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b18" stop-opacity="0"/><stop offset="1" stop-color="#070b18" stop-opacity=".85"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".07"/></pattern>
<clipPath id="clip"><rect width="840" height="520" rx="28"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
.hl{transform-box:fill-box;transform-origin:left;animation:sweep 3s ease-in-out infinite}
@keyframes sweep{0%{transform:scaleX(0);opacity:0}30%,80%{transform:scaleX(1);opacity:1}100%{opacity:0}}
.link{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}</style>
<g clip-path="url(#clip)">
<rect width="840" height="520" fill="url(#bg)"/>
<rect width="840" height="520" fill="url(#dots)"/>
<rect width="840" height="520" fill="url(#glow)"/>
<rect width="840" height="520" fill="url(#glow2)"/>
<g>
