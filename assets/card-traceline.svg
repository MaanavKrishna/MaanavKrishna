<rect class="hl" x="98" y="146" width="210" height="54" rx="6" fill="#a3e635" fill-opacity=".22" stroke="#a3e635" stroke-opacity=".7"/>
<path d="M312,172 C390,172 380,148 462,148" fill="none" stroke="#a3e635" stroke-width="2" stroke-dasharray="5 5" class="link"/>
<rect x="450" y="40" width="340" height="232" rx="16" fill="#0b1224" stroke="#26314f"/>
<text x="474" y="72" class="mono" font-size="13" letter-spacing="2" fill="#a3e635">SUMMARY · ENGINEER</text>
<circle cx="478" cy="99" r="5" fill="#a5adcb"/><text x="494" y="104" class="sans" font-size="17" fill="#a5adcb">Bogie inspection overdue</text><circle cx="478" cy="143" r="5" fill="#a3e635"/><text x="494" y="148" class="sans" font-size="17" fill="#f8fafc">Track 3 maintenance window</text><circle cx="478" cy="187" r="5" fill="#a5adcb"/><text x="494" y="192" class="sans" font-size="17" fill="#a5adcb">Vendor invoice approved</text>
<g transform="translate(474,226)"><rect width="292" height="30" rx="15" fill="#a3e635" fill-opacity=".12" stroke="#a3e635" stroke-opacity=".5"/>
<text x="146" y="20" text-anchor="middle" class="mono" font-size="13" fill="#a3e635">ACTION · inspect bogie · due Fri</text></g>
<g transform="translate(250,258)"><rect width="60" height="22" rx="11" fill="#22c55e" fill-opacity=".2"/><text x="30" y="15" text-anchor="middle" class="mono" font-size="11" fill="#a3e635">ML / EN</text></g>
</g>
<rect y="260" width="840" height="260" fill="url(#fadeDown)"/>
<line x1="44" y1="312" x2="796" y2="312" stroke="url(#acc)" stroke-opacity=".35"/>
</g>
<rect x="1" y="1" width="838" height="518" rx="27" fill="none" stroke="url(#edge)" stroke-width="2"/>

<text x="44" y="350" class="mono" font-size="16" letter-spacing="3" fill="#a3e635">SMART INDIA HACKATHON 2025</text>
