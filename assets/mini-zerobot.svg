<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="ZeroBot: Automated intraday trading for Zerodha with capital allocation and risk rules."><style>@font-face{font-family:'MK Sans';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fb{font-family:'MK Sans',Helvetica, Arial, sans-serif}@font-face{font-family:'MK Display';src:url(data:font/woff2;base64,) format('woff2');font-weight:800;font-style:normal}.fd{font-family:'MK Display','Arial Black', Arial, sans-serif}@font-face{font-family:'MK Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fm{font-family:'MK Mono',ui-monospace, Menlo, Consolas, monospace}@font-face{font-family:'MK Mono Bold';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}.fmb{font-family:'MK Mono Bold',ui-monospace, Menlo, Consolas, monospace}
.plot{stroke-dasharray:1;stroke-dashoffset:1;animation:plot 2.4s cubic-bezier(.65,0,.25,1) forwards}
