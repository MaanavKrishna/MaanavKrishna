@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.cd{opacity:0;animation:fade .5s ease-out forwards}</style>
