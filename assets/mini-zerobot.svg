<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="ZeroBot: Automated intraday trading for Zerodha with capital allocation and risk rules.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10162e"/><stop offset="1" stop-color="#070b18"/></linearGradient>
<radialGradient id="glow" cx="15%" cy="50%" r="55%"><stop offset="0" stop-color="#34d399" stop-opacity=".28"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".8"/><stop offset="1" stop-color="#fb7185" stop-opacity=".2"/></linearGradient>
<clipPath id="clip"><rect width="840" height="300" rx="24"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
.cd{animation:pulse 2.4s ease-in-out infinite}</style>
<g clip-path="url(#clip)"><rect width="840" height="300" fill="url(#bg)"/><rect width="840" height="300" fill="url(#glow)"/>
<g><line x1="56" y1="123" x2="56" y2="172" stroke="#34d399" stroke-width="2"/><rect class="cd" x="50" y="137" width="12" height="23" rx="2" fill="#34d399" style="animation-delay:0.00s"/><line x1="80" y1="86" x2="80" y2="149" stroke="#34d399" stroke-width="2"/><rect class="cd" x="74" y="100" width="12" height="37" rx="2" fill="#34d399" style="animation-delay:0.15s"/><line x1="104" y1="86" x2="104" y2="133" stroke="#fb7185" stroke-width="2"/><rect class="cd" x="98" y="100" width="12" height="21" rx="2" fill="#fb7185" style="animation-delay:0.30s"/><line x1="128" y1="91" x2="128" y2="133" stroke="#34d399" stroke-width="2"/><rect class="cd" x="122" y="105" width="12" height="16" rx="2" fill="#34d399" style="animation-delay:0.45s"/><line x1="152" y1="77" x2="152" y2="117" stroke="#34d399" stroke-width="2"/><rect class="cd" x="146" y="91" width="12" height="14" rx="2" fill="#34d399" style="animation-delay:0.60s"/><line x1="176" y1="77" x2="176" y2="126" stroke="#fb7185" stroke-width="2"/><rect class="cd" x="170" y="91" width="12" height="23" rx="2" fill="#fb7185" style="animation-delay:0.75s"/><line x1="200" y1="100" x2="200" y2="156" stroke="#fb7185" stroke-width="2"/><rect class="cd" x="194" y="114" width="12" height="30" rx="2" fill="#fb7185" style="animation-delay:0.90s"/><line x1="224" y1="109" x2="224" y2="156" stroke="#34d399" stroke-width="2"/><rect class="cd" x="218" y="123" width="12" height="21" rx="2" fill="#34d399" style="animation-delay:1.05s"/><line x1="248" y1="109" x2="248" y2="149" stroke="#fb7185" stroke-width="2"/><rect class="cd" x="242" y="123" width="12" height="14" rx="2" fill="#fb7185" style="animation-delay:1.20s"/><text x="50" y="270" class="mono" font-size="13" fill="#a5adcb">NSE · BSE · stop-loss on</text></g></g>
<rect x="1" y="1" width="838" height="298" rx="23" fill="none" stroke="url(#edge)" stroke-width="2"/>
<text x="290" y="110" class="sans" font-size="40" font-weight="800" fill="#f8fafc">ZeroBot</text>
<text x="290" y="150" class="sans" font-size="19" fill="#a5adcb">Automated intraday trading for Zerodha</text>
<text x="290" y="178" class="sans" font-size="19" fill="#a5adcb">with capital allocation and risk rules.</text>
<g transform="translate(290,214)"><rect width="77" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".45"/><text x="39" y="20" text-anchor="middle" class="mono" font-size="14" fill="#34d399">Python</text></g><g transform="translate(375,214)"><rect width="120" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".45"/><text x="60" y="20" text-anchor="middle" class="mono" font-size="14" fill="#34d399">KiteConnect</text></g><g transform="translate(503,214)"><rect width="86" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".45"/><text x="43" y="20" text-anchor="middle" class="mono" font-size="14" fill="#34d399">Next.js</text></g>
</svg>