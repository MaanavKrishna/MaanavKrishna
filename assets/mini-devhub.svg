<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="DevHub: GitHub discovery workspace: search, compare and save developers and repositories.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10162e"/><stop offset="1" stop-color="#070b18"/></linearGradient>
<radialGradient id="glow" cx="15%" cy="50%" r="55%"><stop offset="0" stop-color="#60a5fa" stop-opacity=".28"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa" stop-opacity=".8"/><stop offset="1" stop-color="#c084fc" stop-opacity=".2"/></linearGradient>
<clipPath id="clip"><rect width="840" height="300" rx="24"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
.g{transform-box:fill-box;transform-origin:bottom;animation:gr 2s ease-in-out infinite alternate}@keyframes gr{from{transform:scaleY(.5)}to{transform:scaleY(1)}}</style>
<g clip-path="url(#clip)"><rect width="840" height="300" fill="url(#bg)"/><rect width="840" height="300" fill="url(#glow)"/>
<g><rect class="g" x="60" y="140" width="16" height="90" rx="4" fill="#60a5fa" style="animation-delay:-0.0s"/><rect class="g" x="78" y="170" width="16" height="60" rx="4" fill="#c084fc" style="animation-delay:-0.6s"/><rect class="g" x="106" y="180" width="16" height="50" rx="4" fill="#60a5fa" style="animation-delay:-0.3s"/><rect class="g" x="124" y="120" width="16" height="110" rx="4" fill="#c084fc" style="animation-delay:-0.8999999999999999s"/><rect class="g" x="152" y="110" width="16" height="120" rx="4" fill="#60a5fa" style="animation-delay:-0.6s"/><rect class="g" x="170" y="150" width="16" height="80" rx="4" fill="#c084fc" style="animation-delay:-1.2s"/><rect class="g" x="198" y="160" width="16" height="70" rx="4" fill="#60a5fa" style="animation-delay:-0.8999999999999999s"/><rect class="g" x="216" y="135" width="16" height="95" rx="4" fill="#c084fc" style="animation-delay:-1.5s"/><line x1="50" y1="232" x2="250" y2="232" stroke="#fff" stroke-opacity=".2"/></g></g>
<rect x="1" y="1" width="838" height="298" rx="23" fill="none" stroke="url(#edge)" stroke-width="2"/>
<text x="290" y="110" class="sans" font-size="40" font-weight="800" fill="#f8fafc">DevHub</text>
<text x="290" y="150" class="sans" font-size="19" fill="#a5adcb">GitHub discovery workspace: search, compare</text>
<text x="290" y="178" class="sans" font-size="19" fill="#a5adcb">and save developers and repositories.</text>
<g transform="translate(290,214)"><rect width="86" height="30" rx="15" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".45"/><text x="43" y="20" text-anchor="middle" class="mono" font-size="14" fill="#60a5fa">Next.js</text></g><g transform="translate(384,214)"><rect width="77" height="30" rx="15" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".45"/><text x="39" y="20" text-anchor="middle" class="mono" font-size="14" fill="#60a5fa">Prisma</text></g><g transform="translate(469,214)"><rect width="94" height="30" rx="15" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".45"/><text x="47" y="20" text-anchor="middle" class="mono" font-size="14" fill="#60a5fa">Postgres</text></g>
</svg>