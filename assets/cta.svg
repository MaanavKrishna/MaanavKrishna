<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="Let's build something hard and honest. maanavkrishna@gmail.com. Open to internships in SWE, ML and quant."><style>@font-face{font-family:'MK Heading';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}.fh{font-family:'MK Heading','Helvetica Neue', Arial, sans-serif}@font-face{font-family:'MK Mono Bold';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}.fmb{font-family:'MK Mono Bold',ui-monospace, Menlo, Consolas, monospace}@font-face{font-family:'MK Serif';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:italic}.fs{font-family:'MK Serif',Georgia, serif}
.plot{stroke-dasharray:1;stroke-dashoffset:1;animation:plot 2.2s cubic-bezier(.65,0,.25,1) forwards}
@keyframes plot{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center}
.ul{transform-box:fill-box;transform-origin:left;animation:ul 1.6s cubic-bezier(.65,0,.25,1) .6s both}@keyframes ul{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style><defs><clipPath id="clip"><rect width="1600" height="560" rx="30"/></clipPath></defs>
<g clip-path="url(#clip)"><rect width="1600" height="560" fill="#0C0C0C"/>
<text x="56.0" y="76.0" class="fmb" font-size="14" fill="#5A72FF" letter-spacing="2" >CONTACT</text>
<text x="52.0" y="226.0" class="fs" font-size="128" fill="#F2EFE7" letter-spacing="-2" >Let's build something</text>
<text x="52.0" y="350.0" class="fs" font-size="128" fill="#5A72FF" letter-spacing="-2" >hard and honest.</text>
<line x1="56" y1="420" x2="1544" y2="420" stroke="#2C2C2C"/>
<text x="56.0" y="488.0" class="fh" font-size="38" fill="#F2EFE7" letter-spacing="-0.8" >maanavkrishna@gmail.com</text>
<rect class="ul" x="56" y="502" width="473" height="3" fill="#5A72FF"/>
<g transform="translate(1544,478)"><circle cx="-398" cy="-5" r="6" fill="#5A72FF" style="animation:pulse 1.4s infinite"/>
<text x="0.0" y="0.0" class="fmb" font-size="14" fill="#F2EFE7" text-anchor="end" letter-spacing="1.5" >OPEN TO INTERNSHIPS  /  SWE, ML, QUANT</text></g>
<text x="1544.0" y="508.0" class="fs" font-size="22" fill="#8E8A82" text-anchor="end" >Chennai, India</text>
