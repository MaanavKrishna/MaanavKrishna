<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="Web3Beacon: A friendly guide to Web3, with a wallet demo that never signs or moves funds.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10162e"/><stop offset="1" stop-color="#070b18"/></linearGradient>
<radialGradient id="glow" cx="15%" cy="50%" r="55%"><stop offset="0" stop-color="#818cf8" stop-opacity=".28"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8" stop-opacity=".8"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".2"/></linearGradient>
<clipPath id="clip"><rect width="840" height="300" rx="24"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(3.2);opacity:0}}</style>
<g clip-path="url(#clip)"><rect width="840" height="300" fill="url(#bg)"/><rect width="840" height="300" fill="url(#glow)"/>
<g><circle class="ring" cx="150" cy="150" r="30" fill="none" stroke="#818cf8" stroke-width="3" style="animation-delay:-0s"/><circle class="ring" cx="150" cy="150" r="30" fill="none" stroke="#818cf8" stroke-width="3" style="animation-delay:-1s"/><circle class="ring" cx="150" cy="150" r="30" fill="none" stroke="#818cf8" stroke-width="3" style="animation-delay:-2s"/><path d="M150,118 L176,150 L150,182 L124,150 Z" fill="url(#acc)"/></g></g>
<rect x="1" y="1" width="838" height="298" rx="23" fill="none" stroke="url(#edge)" stroke-width="2"/>
<text x="290" y="110" class="sans" font-size="40" font-weight="800" fill="#f8fafc">Web3Beacon</text>
<text x="290" y="150" class="sans" font-size="19" fill="#a5adcb">A friendly guide to Web3, with a wallet</text>
<text x="290" y="178" class="sans" font-size="19" fill="#a5adcb">demo that never signs or moves funds.</text>
<g transform="translate(290,214)"><rect width="60" height="30" rx="15" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".45"/><text x="30" y="20" text-anchor="middle" class="mono" font-size="14" fill="#818cf8">HTML</text></g><g transform="translate(358,214)"><rect width="52" height="30" rx="15" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".45"/><text x="26" y="20" text-anchor="middle" class="mono" font-size="14" fill="#818cf8">CSS</text></g><g transform="translate(418,214)"><rect width="94" height="30" rx="15" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".45"/><text x="47" y="20" text-anchor="middle" class="mono" font-size="14" fill="#818cf8">EIP-6963</text></g>
</svg>