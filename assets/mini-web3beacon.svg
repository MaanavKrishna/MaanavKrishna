<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="Web3Beacon: A friendly guide to Web3, with a wallet demo that never signs or moves funds."><style>@font-face{font-family:'MK Sans';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fb{font-family:'MK Sans',Helvetica, Arial, sans-serif}@font-face{font-family:'MK Display';src:url(data:font/woff2;base64,) format('woff2');font-weight:800;font-style:normal}.fd{font-family:'MK Display','Arial Black', Arial, sans-serif}@font-face{font-family:'MK Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fm{font-family:'MK Mono',ui-monospace, Menlo, Consolas, monospace}@font-face{font-family:'MK Mono Bold';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}.fmb{font-family:'MK Mono Bold',ui-monospace, Menlo, Consolas, monospace}
.plot{stroke-dasharray:1;stroke-dashoffset:1;animation:plot 2.4s cubic-bezier(.65,0,.25,1) forwards}
@keyframes plot{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(3.4);opacity:0}}</style>
