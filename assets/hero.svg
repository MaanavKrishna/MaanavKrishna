<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}

.rod{transform-box:fill-box;transform-origin:bottom;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.orb{animation:drift 14s ease-in-out infinite}
.role{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:34px;fill:#5eead4;opacity:0;animation:roll 12.5s infinite}
@keyframes roll{0%{opacity:0;transform:translateY(14px)}3%,17%{opacity:1;transform:none}20%,100%{opacity:0;transform:translateY(-14px)}}
.cur{animation:blink 1s steps(1) infinite}
</style>
