<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="Maanav Krishna, builder. CSE at SRMIST, class of 2029.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1230"/><stop offset="1" stop-color="#05070f"/></linearGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#0d9488" stop-opacity=".5"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></radialGradient>
<radialGradient id="g3"><stop offset="0" stop-color="#ec4899" stop-opacity=".35"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
<linearGradient id="name" x1="80" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
<stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c4b5fd"/><stop offset=".75" stop-color="#5eead4"/><stop offset="1" stop-color="#ffffff"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-400 0;400 0;-400 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="rod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="clip"><rect width="1600" height="560" rx="30"/></clipPath>
