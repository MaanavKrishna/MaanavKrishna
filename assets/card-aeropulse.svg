<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-label="AeroPulse: An airfare price index for MoSPI, built to feed India's CPI.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10162e"/><stop offset="1" stop-color="#070b18"/></linearGradient>
<radialGradient id="glow" cx="88%" cy="0%" r="75%"><stop offset="0" stop-color="#38bdf8" stop-opacity=".30"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#818cf8" stop-opacity=".18"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".9"/><stop offset=".5" stop-color="#818cf8" stop-opacity=".25"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".5"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b18" stop-opacity="0"/><stop offset="1" stop-color="#070b18" stop-opacity=".85"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".07"/></pattern>
<clipPath id="clip"><rect width="840" height="520" rx="28"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.fade{animation:fade 1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 5s ease-out infinite}
@keyframes draw{0%{stroke-dashoffset:1200}55%,100%{stroke-dashoffset:0}}</style>
<g clip-path="url(#clip)">
<rect width="840" height="520" fill="url(#bg)"/>
<rect width="840" height="520" fill="url(#dots)"/>
<rect width="840" height="520" fill="url(#glow)"/>
<rect width="840" height="520" fill="url(#glow2)"/>
<g>
<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs>
<line x1="80" y1="102" x2="780" y2="102" stroke="#fff" stroke-opacity=".06"/><line x1="80" y1="152" x2="780" y2="152" stroke="#fff" stroke-opacity=".06"/><line x1="80" y1="202" x2="780" y2="202" stroke="#fff" stroke-opacity=".06"/><line x1="80" y1="252" x2="780" y2="252" stroke="#fff" stroke-opacity=".06"/>
<path d="M80,200.0 L115,191.5 L150,174.2 L185,155.6 L220,150.9 L255,162.4 L290,176.0 L325,180.4 L360,181.1 L395,188.8 L430,200.7 L465,201.9 L500,185.6 L535,163.6 L570,149.9 L605,143.3 L640,132.4 L675,115.4 L710,105.4 L745,112.8 L780,129.7 L780,262 L80,262 Z" fill="url(#ar)"/>
<path d="M80,200.0 L115,191.5 L150,174.2 L185,155.6 L220,150.9 L255,162.4 L290,176.0 L325,180.4 L360,181.1 L395,188.8 L430,200.7 L465,201.9 L500,185.6 L535,163.6 L570,149.9 L605,143.3 L640,132.4 L675,115.4 L710,105.4 L745,112.8 L780,129.7" class="ln" fill="none" stroke="url(#acc)" stroke-width="3.5" stroke-linejoin="round"/>
<circle cx="80" cy="200.0" r="3.5" fill="#38bdf8"/><circle cx="220" cy="150.9" r="3.5" fill="#38bdf8"/><circle cx="360" cy="181.1" r="3.5" fill="#38bdf8"/><circle cx="500" cy="185.6" r="3.5" fill="#38bdf8"/><circle cx="640" cy="132.4" r="3.5" fill="#38bdf8"/><circle cx="780" cy="129.7" r="3.5" fill="#38bdf8"/>
<path id="arc" d="M60,80 Q420,-10 800,70" fill="none" stroke="#818cf8" stroke-opacity=".4" stroke-dasharray="4 8"/>
<g><animateMotion dur="6s" repeatCount="indefinite" rotate="auto"><mpath href="#arc"/></animateMotion>
<path d="M-14,0 L10,-2 L16,0 L10,2 Z M-2,-1 L-8,-12 L-3,-12 L5,-1 Z M-2,1 L-8,12 L-3,12 L5,1 Z M-14,0 L-18,-6 L-15,-6 L-10,-1 Z M-14,0 L-18,6 L-15,6 L-10,1 Z" fill="#f8fafc"/></g>
<text x="80" y="290" class="mono" font-size="13" fill="#5b6585">T+1</text><text x="780" y="290" text-anchor="end" class="mono" font-size="13" fill="#5b6585">T+45</text>
<text x="430" y="290" text-anchor="middle" class="mono" font-size="13" fill="#a5adcb">11 sources · quality-scored 0–100 · reproducible</text>
</g>
<rect y="260" width="840" height="260" fill="url(#fadeDown)"/>
<line x1="44" y1="312" x2="796" y2="312" stroke="url(#acc)" stroke-opacity=".35"/>
</g>
<rect x="1" y="1" width="838" height="518" rx="27" fill="none" stroke="url(#edge)" stroke-width="2"/>

<text x="44" y="350" class="mono" font-size="16" letter-spacing="3" fill="#38bdf8">SMART INDIA HACKATHON 2026</text>
<text x="44" y="400" class="sans" font-size="46" font-weight="800" fill="#f8fafc">AeroPulse</text>
<text x="44" y="438" class="sans" font-size="21" fill="#a5adcb">An airfare price index for MoSPI, built to feed India's CPI.</text>
