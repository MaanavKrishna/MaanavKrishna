<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="124" viewBox="0 0 1600 124" role="img" aria-label="DevHub: GitHub discovery: search, compare and save devs and repos."><style>@font-face{font-family:'MK Body';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.fb{font-family:'MK Body','Helvetica Neue', Arial, sans-serif}@font-face{font-family:'MK Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.fm{font-family:'MK Mono',ui-monospace, Menlo, Consolas, monospace}@font-face{font-family:'MK Mono Bold';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}.fmb{font-family:'MK Mono Bold',ui-monospace, Menlo, Consolas, monospace}@font-face{font-family:'MK Display';src:url(data:font/woff2;base64,) format('woff2');font-weight:800;font-style:normal}.fx{font-family:'MK Display','Helvetica Neue', Arial, sans-serif}
.plot{stroke-dasharray:1;stroke-dashoffset:1;animation:plot 2.2s cubic-bezier(.65,0,.25,1) forwards}
@keyframes plot{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center}
.g{transform-box:fill-box;transform-origin:bottom;animation:gr 2s ease-in-out infinite alternate}@keyframes gr{from{transform:scaleY(.4)}to{transform:scaleY(1)}}.nudge{animation:nudge 2.6s ease-in-out infinite}@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translate(2.5px,-2.5px)}}</style><rect x=".75" y=".75" width="1598.5" height="122.5" rx="22" fill="#F2EFE7" stroke="#D2CDC1" stroke-width="1.5"/><text x="44.0" y="72.0" class="fmb" font-size="14" fill="#1F3BFF" letter-spacing="1" >10</text><text x="104.0" y="78.0" class="fx" font-size="40" fill="#0C0C0C" letter-spacing="-1.5" >DevHub</text><text x="470.0" y="76.0" class="fb" font-size="21" fill="#86827A" >GitHub discovery: search, compare and save devs and repos.</text><text x="1110.0" y="74.0" class="fm" font-size="12" fill="#86827A" letter-spacing="1.2" >NEXT.JS / PRISMA / POSTGRES</text><g transform="translate(1418,62)"><rect class="g" x="-36" y="-8" width="10" height="26" fill="#0C0C0C" style="animation-delay:-0.0s"/><rect class="g" x="-25" y="0" width="10" height="18" fill="#1F3BFF" style="animation-delay:-0.5s"/><rect class="g" x="-10" y="4" width="10" height="14" fill="#0C0C0C" style="animation-delay:-0.3s"/><rect class="g" x="1" y="-16" width="10" height="34" fill="#1F3BFF" style="animation-delay:-0.8s"/><rect class="g" x="16" y="-18" width="10" height="36" fill="#0C0C0C" style="animation-delay:-0.6s"/><rect class="g" x="27" y="-6" width="10" height="24" fill="#1F3BFF" style="animation-delay:-1.1s"/></g><g transform="translate(1538,62)"><circle r="24" fill="none" stroke="#0C0C0C" stroke-width="1.5" stroke-opacity=".35"/><path class="nudge" d="M-6,6 L6,-6 M-4,-6 H6 V4" fill="none" stroke="#0C0C0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>