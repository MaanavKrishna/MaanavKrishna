<line x1="44" y1="312" x2="796" y2="312" stroke="url(#acc)" stroke-opacity=".35"/>
</g>
<rect x="1" y="1" width="838" height="518" rx="27" fill="none" stroke="url(#edge)" stroke-width="2"/>

<text x="44" y="350" class="mono" font-size="16" letter-spacing="3" fill="#fbbf24">AI × SECURITY · FORGEHACKS</text>
<text x="44" y="400" class="sans" font-size="46" font-weight="800" fill="#f8fafc">Countersign</text>
<text x="44" y="438" class="sans" font-size="21" fill="#a5adcb">AI can fake a voice. It can't fake our secret.</text>
